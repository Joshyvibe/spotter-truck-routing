# Local stack: docker compose up  ->  API on :8000, web on :5173
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotter
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env   # TOMTOM_API_KEY lives here (git-ignored)
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://spotter:spotter@postgres:5432/spotter
      REDIS_URL: redis://redis:6379/0
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-tomtom}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-openmeteo}
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  pgdata:
  web_node_modules:
